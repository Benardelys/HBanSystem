plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.3'
}

group = 'com.ardelys.abans'
version = '1.0.0-RELEASE'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://oss.sonatype.org/content/groups/public/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.28-alpha'
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'org.jetbrains:annotations:26.0.1'

    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.xerial:sqlite-jdbc:3.47.1.0'
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.4.1'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

shadowJar {
    archiveClassifier.set('')
    relocate 'com.zaxxer.hikari', 'com.ardelys.abans.lib.hikari'
    relocate 'com.github.benmanes.caffeine', 'com.ardelys.abans.lib.caffeine'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
