  reload-success: "%prefix%&aHBanSystem yapılandırma dosyaları başarıyla yenilendi."
  error-occurred: "%prefix%&cİşlem gerçekleştirilirken bir hata meydana geldi. Konsol kayıtlarını kontrol edin."
